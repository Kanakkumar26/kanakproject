<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Video Download Button</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #0f172a;
            background-image: 
                radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(168, 85, 247, 0.15) 0px, transparent 50%);
        }

        /* Container for central layout */
        .container {
            text-align: center;
            padding: 2rem;
        }

        .download-btn {
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 18px 38px;
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: 1.5px;
            color: #ffffff;
            text-decoration: none;
            background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            border-radius: 50px;
            box-shadow: 0 10px 25px -5px rgba(99, 102, 241, 0.4),
                        0 8px 10px -6px rgba(168, 85, 247, 0.4);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.2);
            cursor: pointer;
        }

        /* Hover & Active states */
        .download-btn:hover {
            transform: translateY(-4px) scale(1.03);
            box-shadow: 0 20px 35px -5px rgba(99, 102, 241, 0.6),
                        0 15px 15px -6px rgba(168, 85, 247, 0.5);
            background: linear-gradient(135deg, #4f46e5 0%, #9333ea 100%);
        }

        .download-btn:active {
            transform: translateY(1px) scale(0.98);
            box-shadow: 0 5px 15px -3px rgba(99, 102, 241, 0.4);
        }

        /* SVG Icon styling & animation */
        .download-btn svg {
            width: 24px;
            height: 24px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2.2;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: transform 0.3s ease;
        }

        .download-btn:hover svg {
            transform: translateY(2px);
        }

        /* Shine effect overlay */
        .download-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                90deg,
                transparent,
                rgba(255, 255, 255, 0.3),
                transparent
            );
            transition: 0.6s;
        }

        .download-btn:hover::before {
            left: 100%;
        }

        /* Pulse glow background */
        .glow-effect {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50px;
            background: inherit;
            filter: blur(15px);
            opacity: 0.4;
            z-index: -1;
            transition: opacity 0.3s;
        }

        .download-btn:hover + .glow-effect {
            opacity: 0.8;
            filter: blur(20px);
        }
    </style>
</head>
<body>

    <div class="container">
        <div style="position: relative; display: inline-block;">
            <a href="" class="download-btn">
                <!-- Video/Download Icon -->
                <svg xmlns="C:\Users\kumar\Videos\2026-09-26 14-50-03.mp4" viewBox="0 0 24 24">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                    <polyline points="7 10 12 15 17 10"></polyline>
                    <line x1="12" y1="15" x2="12" y2="3"></line>
                </svg>
                <span>DOWNLOAD</span>
            </a>
            <div class="glow-effect"></div>
        </div>
    </div>

</body>
</html>
